[project]
name = "signalweave"
version = "0.1.0"
description = "Private research memory for evolving evidence-based threads"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "anthropic>=0.40.0"]

[project.scripts]
signalweave = "signalweave.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalweave"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
